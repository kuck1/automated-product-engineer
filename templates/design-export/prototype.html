<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design export prototype</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--space-6);
        color: var(--color-text-primary);
        background: var(--color-surface-subtle);
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        width: min(100%, 560px);
        padding: var(--space-6);
        border: 1px solid var(--color-border-default);
        border-radius: var(--radius-surface);
        background: var(--color-surface-default);
      }
      h1 { margin: 0 0 var(--space-2); font-size: clamp(1.5rem, 4vw, 2rem); }
      p { margin: 0 0 var(--space-4); color: var(--color-text-secondary); }
      button {
        min-height: 44px;
        padding: 0 var(--space-4);
        border: 0;
        border-radius: var(--radius-control);
        color: white;
        background: var(--color-action-primary);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: background var(--motion-fast) ease;
      }
      button:hover { background: var(--color-action-primary-hover); }
      button:focus-visible { outline: 3px solid color-mix(in srgb, var(--color-border-focus), transparent 55%); outline-offset: 2px; }
      .error { color: #a22424; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <h1 id="title">Implementation-ready prototype</h1>
      <p id="message"></p>
      <button type="button">Primary action</button>
    </main>
    <script>
      const state = new URLSearchParams(location.search).get("state") || "default";
      const message = document.querySelector("#message");
      const copy = {
        default: "Use URL parameters to make every meaningful state reproducible.",
        loading: "Loading the latest information…",
        empty: "Nothing is available yet.",
        error: "We could not complete that request. Your work is preserved; try again."
      };
      message.textContent = copy[state] || copy.default;
      if (state === "error") message.className = "error";
      if (state === "loading") document.querySelector("button").disabled = true;
    </script>
  </body>
</html>
