name: Verify reference app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/validate.py

  code:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  multiplatform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: templates/kotlin-multiplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: node tools/validate-contracts.mjs
      - run: node tools/compile-tokens.mjs --check
      - run: node tools/compile-scenarios.mjs --check
      - run: gradle :shared:product-kernel:hostTest
      - run: gradle :androidApp:lintDebug :androidApp:testDebugUnitTest :androidApp:assembleDebug

  multiplatform-ios:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: templates/kotlin-multiplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle :shared:product-kernel:linkDebugFrameworkIosSimulatorArm64
      - name: Typecheck Swift projection
        run: |
          FRAMEWORK="shared/product-kernel/build/bin/iosSimulatorArm64/debugFramework/ProductKernel.framework"
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios17.0-simulator \
            -typecheck -F "$(dirname "$FRAMEWORK")" \
            iosApp/Generated/DesignTokens.swift iosApp/Sources/WorkItemModel.swift iosApp/Sources/WorkItemScreen.swift iosApp/Sources/ProductApp.swift
